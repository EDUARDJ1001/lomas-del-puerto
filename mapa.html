<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lomas del Puerto · Lotes disponibles</title>
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="img/favicon-192.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#1e5b3c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <a href="./" class="back" aria-label="Volver al inicio">←</a>
      <h1><a href="./"><img src="img/logo-color.webp" alt="Lomas del Puerto" width="360" height="261"></a></h1>
      <p><span>Barrio Lomas del Puerto</span><span class="sep"> · </span><span>Puerto Cortés</span></p>
    </div>
    <ul class="legend" id="legend"></ul>
  </header>

  <main class="layout">
    <section class="map-wrap" aria-label="Mapa de lotes">
      <svg id="map" role="img" aria-label="Plano de lotificación"></svg>
      <div class="map-tools">
        <button type="button" data-zoom="in" aria-label="Acercar">+</button>
        <button type="button" data-zoom="out" aria-label="Alejar">−</button>
        <button type="button" data-zoom="fit" aria-label="Ver todo">⤢</button>
      </div>
      <div class="north" aria-hidden="true">N<span>▲</span></div>
      <div class="tooltip" id="tooltip" hidden></div>
    </section>

    <aside class="panel" id="panel" aria-live="polite" hidden>
      <div class="panel-handle" aria-hidden="true"></div>
      <button type="button" class="panel-close" id="panel-close" aria-label="Cerrar">×</button>
      <div class="gallery" id="gallery"></div>
      <div class="panel-body">
        <p class="eyebrow" id="p-bloque"></p>
        <h2 id="p-titulo"></h2>
        <span class="badge">Disponible</span>
        <dl class="specs">
          <div><dt>Área</dt><dd id="p-area"></dd></div>
          <div><dt>Área en varas²</dt><dd id="p-vrs"></dd></div>
          <div><dt>Medidas aprox.</dt><dd id="p-medidas"></dd></div>
          <div><dt>Precio</dt><dd id="p-precio"></dd></div>
        </dl>
        <p class="desc" id="p-desc"></p>
        <div class="acciones">
          <a class="cta cta-wa" id="p-cta" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.5-.4Z"/></svg>
            Contáctame
          </a>
          <button type="button" class="cta cta-outline" id="p-info">Solicitar información</button>
        </div>
      </div>
    </aside>
  </main>

  <!-- Solicitud de información (todavía no se envía a ningún lado) -->
  <dialog class="modal" id="modal-contacto" aria-labelledby="modal-titulo">
    <form class="contacto" id="contacto" novalidate>
      <div class="modal-head">
        <h3 id="modal-titulo">Solicitar información</h3>
        <button type="button" class="modal-close" id="modal-close" aria-label="Cerrar">×</button>
      </div>
      <p class="modal-lote" id="modal-lote"></p>
      <label>Nombre
        <input name="nombre" autocomplete="name" required>
      </label>
      <label>Celular
        <input name="celular" type="tel" inputmode="tel" autocomplete="tel" placeholder="9999-9999" required pattern="\+?[0-9 \-]{8,}">
      </label>
      <label><span>Correo <small>(opcional)</small></span>
        <input name="correo" type="email" autocomplete="email" placeholder="tucorreo@ejemplo.com">
      </label>
      <label>Mensaje
        <textarea name="mensaje" rows="3" required></textarea>
      </label>
      <button class="cta" type="submit">Enviar solicitud</button>
      <p class="form-status" id="contacto-status" role="status" hidden></p>
    </form>
  </dialog>

  <div class="lightbox" id="lightbox" hidden>
    <button type="button" class="lb-close" aria-label="Cerrar">×</button>
    <button type="button" class="lb-nav lb-prev" aria-label="Anterior">‹</button>
    <img alt="">
    <button type="button" class="lb-nav lb-next" aria-label="Siguiente">›</button>
    <span class="lb-count"></span>
  </div>

  <script src="js/config.js"></script>
  <script src="js/inventario.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
