<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lomas del Puerto · Lotes disponibles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1><a href="./" class="back" aria-label="Volver al inicio">←</a> Lomas del Puerto</h1>
      <p>Barrio Lomas del Puerto · Puerto Cortés</p>
    </div>
    <ul class="legend" id="legend"></ul>
  </header>

  <main class="layout">
    <section class="map-wrap" aria-label="Mapa de lotes">
      <svg id="map" role="img" aria-label="Plano de lotificación"></svg>
      <div class="map-tools">
        <button type="button" data-zoom="in" aria-label="Acercar">+</button>
        <button type="button" data-zoom="out" aria-label="Alejar">−</button>
        <button type="button" data-zoom="fit" aria-label="Ver todo">⤢</button>
      </div>
      <div class="north" aria-hidden="true">N<span>▲</span></div>
      <div class="tooltip" id="tooltip" hidden></div>
    </section>

    <aside class="panel" id="panel" aria-live="polite" hidden>
      <div class="panel-handle" aria-hidden="true"></div>
      <button type="button" class="panel-close" id="panel-close" aria-label="Cerrar">×</button>
      <div class="gallery" id="gallery"></div>
      <div class="panel-body">
        <p class="eyebrow" id="p-bloque"></p>
        <h2 id="p-titulo"></h2>
        <span class="badge">Disponible</span>
        <dl class="specs">
          <div><dt>Área</dt><dd id="p-area"></dd></div>
          <div><dt>Área en varas²</dt><dd id="p-vrs"></dd></div>
          <div><dt>Medidas aprox.</dt><dd id="p-medidas"></dd></div>
          <div><dt>Precio</dt><dd id="p-precio"></dd></div>
        </dl>
        <p class="desc" id="p-desc"></p>
        <a class="cta" id="p-cta" target="_blank" rel="noopener" hidden>Me interesa este lote</a>
      </div>
    </aside>
  </main>

  <div class="lightbox" id="lightbox" hidden>
    <button type="button" class="lb-close" aria-label="Cerrar">×</button>
    <button type="button" class="lb-nav lb-prev" aria-label="Anterior">‹</button>
    <img alt="">
    <button type="button" class="lb-nav lb-next" aria-label="Siguiente">›</button>
    <span class="lb-count"></span>
  </div>

  <script src="js/config.js"></script>
  <script src="js/inventario.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
